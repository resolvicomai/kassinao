version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # libsodium-wrappers é pré-1.0: 0.7 -> 0.8 muda API da pilha de áudio e já
    # quebrou antes (#95, #126). Atualização deliberada, com gravação real de teste.
    ignore:
      - dependency-name: "libsodium-wrappers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Qualquer mudança em mcp/ exige publicar uma nova release do conector no npm
    # antes da próxima release do app. devDependencies (typescript, @types/node)
    # não entram no pacote publicado, então só sobem junto com um bump proposital.
    allow:
      - dependency-type: production
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
        update-types: [major, minor, patch]
      actions-minor-patch:
        patterns: ["actions/*"]
        update-types: [minor, patch]
      docker-minor-patch:
        patterns: ["docker/*", "aquasecurity/trivy-action"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # A imagem base segue o Node LTS fixado em engines.node e no CI; major de Node
    # é decisão de release, não bump automático (o PR para Node 25 ficou vermelho).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
